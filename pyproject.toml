[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hip4arb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.0",
    "websockets>=12.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "hyperliquid-python-sdk>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
